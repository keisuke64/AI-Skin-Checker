{% extends "base.html" %}
{% block title %}記録カレンダー{% endblock %}

{% block content %}
<div class="container my-4" style="max-width: 900px;">
  <h2 class="mb-4 text-center">記録カレンダー</h2>

  <div class="card shadow-sm p-3 bg-white">
    <div id="calendar"></div>
  </div>
</div>

<!-- FullCalendar CDN -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');

    const calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      locale: 'ja',
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth'
      },
      buttonText: {
        today: '今日'
      },
      events: '/api/events',  // APIからイベントデータを自動取得
      eventClick: function(info) {
        // イベントクリックで詳細ページに遷移（デフォルト動作を許可）
        if (info.event.url) {
          window.location.href = info.event.url;
          info.jsEvent.preventDefault();
        }
      },
      // ホバー時に生活習慣ヒントを表示（ツールチップ風）
      eventDidMount: function(info) {
        const props = info.event.extendedProps;
        const tooltipText = `スキンケア: ${props.skincare} | 睡眠: ${props.sleep} | 食生活: ${props.diet}`;
        info.el.setAttribute('title', tooltipText);
      }
    });

    calendar.render();
  });
</script>

<style>
  /* カレンダーのスタイル調整 */
  .fc-event {
    cursor: pointer;
    font-weight: bold;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .fc-toolbar-title {
    font-size: 1.25rem !important;
  }
</style>
{% endblock %}
