<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}肌トラブルアプリ{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('index') }}">肌トラブルアプリ</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        {% if session.username %}
          <li class="nav-item">
            <span class="nav-link text-white">こんにちは、{{ session.username }} さん</span>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('index') }}">ホーム</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('upload') }}">写真・生活習慣の記録</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('stats') }}">ニキビ数推移</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('calendar') }}">カレンダー</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('compare') }}">画像比較</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('analysis') }}">相関分析グラフ</a>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('login') }}">ログイン</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('register') }}">登録</a>
          </li>
        {% endif %}
      </ul>
      {% if session.username %}
        <a href="{{ url_for('logout') }}" class="btn btn-outline-light">ログアウト</a>
      {% endif %}
    </div>
  </div>
</nav>

  <hr>
  {% block content %}{% endblock %}
</body>
</html>
