{% extends "base.html" %}
{% block title %}ログイン{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="text-center">ログイン</h2>
    <form method="POST">
      <div class="mb-3">
        <input type="text" name="username" placeholder="ユーザー名" required class="form-control">
      </div>
      <div class="mb-3">
        <input type="password" name="password" placeholder="パスワード" required class="form-control">
      </div>
      <button type="submit" class="btn btn-danger w-100">ログイン</button>
    </form>
    {% if error %}<p class="mt-3 text-danger">{{ error }}</p>{% endif %}
  </div>
</div>
{% endblock %}
