{% extends "base.html" %}
{% block title %}新規登録{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-5">
    <div class="card p-4 shadow-sm">
      <h2 class="text-center mb-4">新規登録</h2>
      <form method="POST">
        <div class="mb-3">
          <input type="text" name="username" placeholder="ユーザー名" required class="form-control">
        </div>
        <div class="mb-3">
          <input type="password" name="password" placeholder="パスワード" required class="form-control">
        </div>
        <button type="submit" class="btn btn-danger w-100">アカウント作成</button>
      </form>
      {% if error %}
        <p class="mt-3 text-danger text-center">{{ error }}</p>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
